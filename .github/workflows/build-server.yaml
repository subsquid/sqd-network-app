name: build-server

on:
  workflow_dispatch: {}
  push:
    branches: [main, develop]
    paths:
      - 'packages/server/**'
      - 'packages/common/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
    
env:
  PROJECT_ID: bright-meridian-316511

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record start time
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Extract cached dependencies
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      - name: env
        id: env
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          if [ "$REF" = "refs/heads/main" ]; then
              echo "app_env=prod" >> $GITHUB_OUTPUT
          else
              echo "app_env=dev" >> $GITHUB_OUTPUT
          fi
        env:
          REF: ${{ github.ref }}

      - run: pnpm install --frozen-lockfile

      # Check compile errors before build
      - run: npx turbo run tsc --filter=@subsquid/server

      - run: npx turbo run build --filter=@subsquid/server --no-cache
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build server image
        run: docker build --progress=plain --target server -t "gcr.io/${PROJECT_ID}/subsquid-network-app-${APP_ENV}-server:${TAG}" -t "gcr.io/${PROJECT_ID}/subsquid-network-app-${APP_ENV}-server:latest" .
        env:
          APP_ENV: ${{ steps.env.outputs.app_env }}
          TAG: ${{ steps.env.outputs.tag }}

      - name: Configure Docker
        run: echo "$GCR_KEY" | docker login -u _json_key --password-stdin https://gcr.io
        env:
          GCR_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Push server image
        run: |
          docker push "gcr.io/${PROJECT_ID}/subsquid-network-app-${APP_ENV}-server:${TAG}"
          docker push "gcr.io/${PROJECT_ID}/subsquid-network-app-${APP_ENV}-server:latest"
        env:
          APP_ENV: ${{ steps.env.outputs.app_env }}
          TAG: ${{ steps.env.outputs.tag }}

      - name: Compute elapsed time
        id: elapsed
        if: always()
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.time }} ))
          echo "value=$(( elapsed / 60 )) min $(( elapsed % 60 )) sec" >> $GITHUB_OUTPUT

      # The payload is built by jq from env vars so no commit text is ever parsed as YAML.
      - name: Build Slack payload
        id: slack
        if: always()
        run: |
          case "$JOB_STATUS" in
            success) icon='✅ Deployed'; color=good ;;
            failure) icon='❌ Failed'; color=danger ;;
            *) icon='⚠️ Cancelled'; color=warning ;;
          esac
          jq -n \
            --arg title "${icon} server [${APP_ENV}]" \
            --arg color "$color" \
            --arg message "$COMMIT_MESSAGE" \
            --arg url "$COMMIT_URL" \
            --arg tag "$TAG" \
            --arg author "$COMMIT_AUTHOR" \
            --arg elapsed "$ELAPSED" \
            '{attachments: [{
              title: $title,
              color: $color,
              text: (($message | split("\n")[0] | gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;"))
                + "\n<" + $url + "|" + $tag + "> by " + $author + " in " + $elapsed)
            }]}' > "$RUNNER_TEMP/slack-payload.json"
        env:
          JOB_STATUS: ${{ job.status }}
          APP_ENV: ${{ steps.env.outputs.app_env }}
          TAG: ${{ steps.env.outputs.tag }}
          ELAPSED: ${{ steps.elapsed.outputs.value }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}

      - name: Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
